[package]
name = "teletext-fuzz"
description = "Fuzz targets of every reader of outside input (requirement 2.6)"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace, so the fuzzing compiler builds it apart.
[workspace]
members = ["."]

[dependencies]
# libFuzzer's bindings, as the engine and the browser pin them (MIT OR
# Apache-2.0).
libfuzzer-sys = "=0.4.13"
teletext-runtime = { path = "../crates/teletext-runtime" }
teletext-native = { path = "../crates/teletext-native" }
# The engine's base64, to write the packets as a program does.
neoteletext-web = { git = "https://github.com/neoteletext/neoteletext-engine", rev = "854015b02f06854df7edf941c6de2aa711ece020", default-features = false }

[profile.release]
debug = 1

[[bin]]
name = "websocket_reader"
path = "fuzz_targets/websocket_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "channel_input"
path = "fuzz_targets/channel_input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session_cookie"
path = "fuzz_targets/session_cookie.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol_reader"
path = "fuzz_targets/protocol_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "opus_sound"
path = "fuzz_targets/opus_sound.rs"
test = false
doc = false
bench = false
