[package]
name = "teletext-fuzz"
description = "Fuzz targets of every reader of outside input (requirement 2.6)"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace, so the fuzzing compiler builds it apart.
[workspace]
members = ["."]

[dependencies]
# libFuzzer's bindings, as the engine and the browser pin them (MIT OR
# Apache-2.0).
libfuzzer-sys = "=0.4.13"
teletext-runtime = { path = "../crates/teletext-runtime" }
teletext-native = { path = "../crates/teletext-native" }
# The engine's input writer, to write viewer state's messages as a
# receiver does.
neoteletext-input = { git = "file:///Users/andrewstuart/devel/neoteletext-renderer-teletext", rev = "a81ac8f1981b34f6a8874e02d780ecd2caae908c", default-features = false }
# The receivers' decoder of a page's rule table, which every table the
# server sends must pass (page-rules.md RULE-59, RULE-83), and the engine's
# packet type, to read the records sent.
neoteletext-rules = { git = "file:///Users/andrewstuart/devel/neoteletext-renderer-teletext", rev = "a81ac8f1981b34f6a8874e02d780ecd2caae908c", default-features = false }
neoteletext-core = { git = "file:///Users/andrewstuart/devel/neoteletext-renderer-teletext", rev = "a81ac8f1981b34f6a8874e02d780ecd2caae908c", default-features = false }
# Ed25519 signing, to make proofs that verify (DEC-6471, approved by name).
ring = { version = "=0.17.14", default-features = false }
# The engine's base64, to write the packets as a program does; its records
# reader, to find the challenges; its signed bytes.
neoteletext-web = { git = "file:///Users/andrewstuart/devel/neoteletext-renderer-teletext", rev = "a81ac8f1981b34f6a8874e02d780ecd2caae908c", default-features = false }

[profile.release]
debug = 1

[[bin]]
name = "websocket_reader"
path = "fuzz_targets/websocket_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "channel_input"
path = "fuzz_targets/channel_input.rs"
