[package]
name = "teletext-fuzz"
description = "Fuzz targets of every reader of outside input (requirement 2.6)"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace, so the fuzzing compiler builds it apart.
[workspace]
members = ["."]

[dependencies]
# libFuzzer's bindings, as the engine and the browser pin them (MIT OR
# Apache-2.0).
libfuzzer-sys = "=0.4.13"
teletext-runtime = { path = "../crates/teletext-runtime" }
teletext-native = { path = "../crates/teletext-native" }
# The engine's input writer, to write viewer state's messages as a
# receiver does.
neoteletext-input = { git = "file:///Users/andrewstuart/devel/neoteletext-renderer-teletext", rev = "02adbf14f6735a3f8cecbf1cc8bcab280d2e3a34", default-features = false }
# Ed25519 signing, to make proofs that verify (DEC-6471, approved by name).
ring = { version = "=0.17.14", default-features = false }
# The engine's base64, to write the packets as a program does; its records
# reader, to find the challenges; its signed bytes.
neoteletext-web = { git = "file:///Users/andrewstuart/devel/neoteletext-renderer-teletext", rev = "02adbf14f6735a3f8cecbf1cc8bcab280d2e3a34", default-features = false }

[profile.release]
debug = 1

[[bin]]
name = "websocket_reader"
path = "fuzz_targets/websocket_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "channel_input"
path = "fuzz_targets/channel_input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "state_messages"
path = "fuzz_targets/state_messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol_reader"
path = "fuzz_targets/protocol_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "opus_sound"
path = "fuzz_targets/opus_sound.rs"
test = false
doc = false
bench = false

[[bin]]
name = "instrument_sound"
path = "fuzz_targets/instrument_sound.rs"
test = false
doc = false
bench = false
