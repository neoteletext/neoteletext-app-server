[toolchain]
# The engine's and the browser's release (`neoteletext-common/DEVELOPMENT.md`
# section 11: the repositories pin the same Rust). wasm32-unknown-unknown is
# Cloudflare Workers' target, which the runtime must always build for
# (requirement 1.3). The others are the native server's systems, which the
# full gate type-checks (requirement 1.1, REQ-1020).
channel = "1.99.0"
components = ["clippy", "rustfmt"]
targets = ["wasm32-unknown-unknown", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
profile = "minimal"
