# Licences, advisories and sources (DEVELOPMENT.md section 7), checked by
# the full gate.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # chrono is unmaintained and no version fixes it; it reaches the server
    # only through Cloudflare's worker crate, in the wasm-only, undeployed
    # Cloudflare host. Reconsider when worker drops chrono (DEC-6441).
    "RUSTSEC-2026-0543",
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "Zlib", "ISC", "CC0-1.0", "Unicode-3.0"]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The engine, a git dependency pinned at one commit (CLAUDE.md): on its
# public repository, or on the local checkout while that commit is
# unpublished (neoteletext-common DEVELOPMENT.md section 11).
allow-git = [
    "https://github.com/neoteletext/neoteletext-renderer-teletext",
    "file:///Users/andrewstuart/devel/neoteletext-renderer-teletext",
    "https://github.com/neoteletext/neoteletext-renderer-regis",
    "file:///Users/andrewstuart/devel/neoteletext-renderer-regis",
]
