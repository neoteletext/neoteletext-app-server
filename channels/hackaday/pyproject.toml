[project]
name = "hackaday"
version = "0.1.0"
description = "Hackaday as a NeoTeletext channel, in Python, served by the Rust server"
requires-python = ">=3.13"
dependencies = ["neoteletext-app"]

[tool.uv.sources]
neoteletext-app = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.17,<0.12"]
build-backend = "uv_build"
