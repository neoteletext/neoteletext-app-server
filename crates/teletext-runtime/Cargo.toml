[package]
name = "teletext-runtime"
description = "The server's runtime without input or output: one channel's pages, sessions and applications, driven by the events a host gives it and answering with the bytes the host sends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Its defaults: a public page's picture is drawn at the levels a receiver
# draws it (REQ-1728 item 4).
neoteletext-core = { workspace = true, features = ["default"] }
neoteletext-formats.workspace = true
neoteletext-image = { workspace = true, features = ["alloc"] }
neoteletext-input.workspace = true
neoteletext-audio.workspace = true
neoteletext-audio-instruments.workspace = true
neoteletext-web = { workspace = true, features = ["alloc"] }
neoteletext-opus.workspace = true
neoteletext-rules.workspace = true
regis.workspace = true
naplps.workspace = true
ring.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
unicode-normalization.workspace = true

# The runtime uses no random source of `ring`'s, but `ring` always depends
# on `getrandom` 0.2, which builds for `wasm32-unknown-unknown` only with
# its Web Crypto backend: the Cloudflare host's target (DEC-6471).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
ring = { workspace = true, features = ["wasm32_unknown_unknown_js"] }

[lints]
workspace = true
