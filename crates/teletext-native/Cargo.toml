[package]
name = "teletext-native"
description = "The server on Linux, macOS and Windows: tokio and hyper around the runtime, HTTP and WebSocket, and the load client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# `cargo run -p teletext-native` runs the server.
default-run = "teletext-server"

[[bin]]
name = "teletext-server"
path = "src/main.rs"

[[bin]]
name = "teletext-load"
path = "src/bin/teletext-load.rs"

[dependencies]
teletext-runtime.workspace = true
neoteletext-web.workspace = true
neoteletext-core.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros", "process", "signal", "fs"] }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
