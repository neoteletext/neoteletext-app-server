# The Python side of the repository (docs/applications.md section 5): the
# thin kit and the channels written in Python, one uv workspace, the tools
# pinned in uv.lock.
[tool.uv]
# The uv on the development machine; the deploy host has a newer one.
required-version = ">=0.8.17"

[tool.uv.workspace]
members = ["kits/python", "channels/hackaday"]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.ruff]
line-length = 140
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
# D203/D212 and the formatter's own conflicts: one choice of each pair.
ignore = ["D203", "D213", "COM812", "ISC001", "CPY001"]

[tool.ruff.lint.per-file-ignores]
# Tests assert with plain assert and use fixtures by name.
"**/tests/**" = ["S101", "PLR2004", "D103", "INP001", "D102", "D107"]
# The character map names the typographic characters it replaces.
"**/charset.py" = ["RUF001"]

[tool.mypy]
strict = true
python_version = "3.13"
warn_unreachable = true

[tool.pytest.ini_options]
# Each package's tests import it by name, so test files may share names.
addopts = ["--import-mode=importlib"]
