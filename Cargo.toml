[workspace]
resolver = "3"
members = ["crates/*"]
# The pinned tools are built from their crates in tools/, each a package of
# its own (scripts/tools.sh).
exclude = ["tools"]

[workspace.package]
# The server's version takes this one's first two numbers; its third is
# the number of the compile, counted in the ignored build-number by
# crates/teletext-native/build.rs and never written here (REQ-7050).
version = "0.1.0"
edition = "2024"
# At most three stable releases behind the pinned toolchain (DEVELOPMENT.md
# section 13).
rust-version = "1.97"
license = "MIT"
publish = false

# Libraries use ordinary version requirements; the programs that ship pin
# `=x.y.z` with the licence and the reason beside each (DEVELOPMENT.md
# section 7). Every library needs the owner's approval by name, recorded
# in a decision (docs/architecture.md section 2).
[workspace.dependencies]
teletext-runtime = { path = "crates/teletext-runtime", default-features = false }

# The engine, imported at one commit and never copied (CLAUDE.md,
# requirement 2.5): its page model, TTI reader and page encoder, its input
# protocol, its audio encoder, and its web pieces (the WebSocket handshake).
neoteletext-core = { git = "https://github.com/neoteletext/neoteletext-renderer-teletext", rev = "3f028815cfd5102726ccdd0e5cada9edbd3e4e88", default-features = false }
neoteletext-formats = { git = "https://github.com/neoteletext/neoteletext-renderer-teletext", rev = "3f028815cfd5102726ccdd0e5cada9edbd3e4e88", default-features = false, features = ["tti", "alloc", "write-text", "picture-text"] }
neoteletext-input = { git = "https://github.com/neoteletext/neoteletext-renderer-teletext", rev = "3f028815cfd5102726ccdd0e5cada9edbd3e4e88", default-features = false }
neoteletext-audio = { git = "https://github.com/neoteletext/neoteletext-renderer-teletext", rev = "3f028815cfd5102726ccdd0e5cada9edbd3e4e88", default-features = false, features = ["encode"] }
neoteletext-web = { git = "https://github.com/neoteletext/neoteletext-renderer-teletext", rev = "3f028815cfd5102726ccdd0e5cada9edbd3e4e88", default-features = false }
# HTTP/3 without input or output, the layer the server built and the
# engine now holds with its client side (REQ-6986, neoteletext-common's
# DEC-6979 item 8): frames, stream types, SETTINGS and QPACK with no
# dynamic table, read and written by the server's HTTP/3 (REQ-6967). No
# dependency of its own.
neoteletext-http3 = { git = "https://github.com/neoteletext/neoteletext-renderer-teletext", rev = "3f028815cfd5102726ccdd0e5cada9edbd3e4e88" }
# The instruments' interfaces, which the server checks every block, patch
# and bank with, so that the encoder and the receiver's checks are one
# implementation (server.md SRV-87, SRV-88; MIDI-21). Only the feature
# `interface`, every family's messages, patch packer and check, bank image
# and restatement tracker, with no synthesis code: the server never plays
# a sound.
neoteletext-audio-instruments = { git = "https://github.com/neoteletext/neoteletext-renderer-teletext", rev = "3f028815cfd5102726ccdd0e5cada9edbd3e4e88", default-features = false, features = ["interface"] }
# A public page's picture (REQ-1728 item 4).
neoteletext-image = { git = "https://github.com/neoteletext/neoteletext-renderer-teletext", rev = "3f028815cfd5102726ccdd0e5cada9edbd3e4e88", default-features = false }
# The mosaic fallback (renderer parity PAR-11, PAR-25): a picture's pixels
# converted into a page of Level 1 mosaics, without the image decoders,
# which the server never needs.
neoteletext-picture = { git = "https://github.com/neoteletext/neoteletext-renderer-teletext", rev = "3f028815cfd5102726ccdd0e5cada9edbd3e4e88", default-features = false }
# The engine's Opus decoder, to hold each packet a program sends to the
# profile the receivers decode (decision 21, the engine's E.123).
# The page rule table's codec and checks (page-rules.md RULE-56, RULE-59):
# the server encodes each table with the crate every receiver decodes it
# with, and checks what it encoded with that crate's decoder.
neoteletext-rules = { git = "https://github.com/neoteletext/neoteletext-renderer-teletext", rev = "3f028815cfd5102726ccdd0e5cada9edbd3e4e88", default-features = false }
neoteletext-opus = { git = "https://github.com/neoteletext/neoteletext-renderer-teletext", rev = "3f028815cfd5102726ccdd0e5cada9edbd3e4e88", default-features = false }
# The ReGIS renderer, pinned to one commit as the engine is (its DEC-6270):
# a program's ReGIS is checked with the receiver's own code before it is
# sent (DEC-6335; the renderer's REQ-6332). MIT; no dependencies.
# The renderers stay on the file:// sources the engine at its pinned
# commit names them by: a GitHub source here would be a second source of
# the same crate, and the build would hold two copies of each renderer.
# They move to GitHub with the engine's own pins.
regis = { git = "file:///Users/andrewstuart/devel/neoteletext-renderer-regis", rev = "717c337257a346df819584a5cd2b524ba7c16c83" }
# The NAPLPS renderer, pinned to one commit as the ReGIS renderer is: a
# page's NAPLPS sprite sheet is read with the receiver's own code before
# it is sent, since a sheet must draw nothing (animation.md ANIM-17,
# ANIM-21), on the receiver's canvas with its character sets (the
# renderer's REQ-5819 and REQ-6668, merged into its working branch).
# MIT; no dependencies.
naplps = { git = "file:///Users/andrewstuart/devel/neoteletext-renderer-naplps", rev = "21f439b52821a1d877d0cf40d150366c778e0092" }
# The fonts the browser draws pictures with, as text compiled in: the
# VT340's alphabet 0 for ReGIS and the NAPLPS stroke font, so that the
# server's mosaic fallback and a public page's picture are drawn as the
# browser draws them (renderer parity PAR-25, PAR-26). The renderers'
# repositories' own crates, pure Rust with no dependencies (DEC-6579).
regis-fonts = { git = "file:///Users/andrewstuart/devel/neoteletext-renderer-regis", rev = "717c337257a346df819584a5cd2b524ba7c16c83" }
naplps-fonts = { git = "file:///Users/andrewstuart/devel/neoteletext-renderer-naplps", rev = "21f439b52821a1d877d0cf40d150366c778e0092" }

# The protocol between the server and a channel's program (DEC-1482):
# schemars, approved by the owner with DEC-1482 (MIT), generates the
# protocol's JSON Schema from its Rust types; serde (MIT or Apache-2.0)
# makes those types serde-strict and serde_json (MIT or Apache-2.0) reads
# and writes their JSON lines. Both are schemars's own dependencies, and
# were in the lockfile when it was given: part of that approval.
# Default features off: no standard library, for the runtime's no_std.
schemars = { version = "=1.2.3", default-features = false, features = ["derive"] }
serde = { version = "=1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["alloc"] }
# The protocol's strict reader (REQ-1475), chosen by the engineer when the
# owner left it to them on 30 October 2026 ("fully solve and complete ...
# in any way you think correct"): serde_path_to_error (MIT or Apache-2.0)
# names the path of the first fault serde finds, and unicode-normalization
# (MIT or Apache-2.0, and Unicode-3.0 for its tables) checks that text is
# in normalisation form C. Default features off: no standard library.
serde_path_to_error = { version = "=0.1.20", default-features = false }
unicode-normalization = { version = "=0.1.26", default-features = false }

# Viewer state's cryptography (DEC-6471, its open question Q7; VS-301,
# VS-305): `ring`, approved by the owner by name with DEC-6471 and DEC-6478,
# Apache-2.0 AND ISC (its BoringSSL-derived parts under ISC). Strict
# Ed25519 verification of a viewer's proof and HMAC-SHA-256 for the
# per-channel handle, both constant-time; the native host also draws its
# random bytes from its `SystemRandom`. Default features off: no `alloc`,
# no `/dev/urandom` fallback, so the runtime stays `no_std`.
ring = { version = "=0.17.14", default-features = false }

# The native host's libraries, approved by the owner on 25 October 2026
# (decision 5).
tokio = { version = "=1.54.1", default-features = false }
hyper = { version = "=1.12.0", default-features = false }
hyper-util = { version = "=0.1.21", default-features = false }
# The native host serving TLS, HTTP/2 and HTTP/3 itself (DEC-6964), taken
# under the owner's standing approval of pure-Rust libraries (DEC-6579);
# their one piece of native code is `ring`, approved by name above. Hyper's
# HTTP/2 comes with its `http2` feature, which brings the hyper project's
# `h2` (MIT).
# - rustls (Apache-2.0 OR ISC OR MIT): TLS 1.3 and 1.2 over the `ring`
#   provider. Default features off: no `aws-lc-rs`, which is C, and no
#   logging through `log`.
# - tokio-rustls (MIT OR Apache-2.0): rustls on a tokio socket. Default
#   features off for the same reason; rustls's features are chosen above.
# - quinn (MIT OR Apache-2.0): QUIC, on tokio, with rustls over `ring`.
#   Default features off: no platform certificate verifier, which a server
#   never needs, and no `log`.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false }
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
# - socket2 (MIT OR Apache-2.0), the tokio project's sockets, already built
#   for tokio and quinn with the same feature: the one way in safe Rust to
#   let several UDP sockets share the QUIC port (SO_REUSEPORT), each with
#   an endpoint of its own (REQ-7006, DEC-7007).
socket2 = { version = "=0.6.5", default-features = false, features = ["all"] }
# Logging (decision 18), approved by the owner on 28 October 2026: the
# Rust ecosystem's structured logging, the tokio project's, MIT. Default
# features off: no procedural macros; the `Targets` filter, not
# `env-filter`, which would bring a regular expression engine.
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json", "std"] }
# systemd's socket activation (requirement 5.6), approved by the owner by
# name on 1 November 2026 (DEC-1767): Apache-2.0. It holds the `unsafe` that
# taking a socket by its descriptor needs, which this workspace forbids.
listenfd = { version = "=1.0.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
strip = true

# The renderers' readers are fed streams of megabytes in the debug test
# builds: the readers' bound tests (`channel/tests/kept.rs`) read hundreds
# of the heaviest streams known, which unoptimised took 103 seconds for
# NAPLPS alone. Overflow checks and debug assertions stay as in any
# debug build.
[profile.dev.package.naplps]
opt-level = 2

[profile.dev.package.regis]
opt-level = 2
