[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# At most three stable releases behind the pinned toolchain (DEVELOPMENT.md
# section 13).
rust-version = "1.97"
license = "MIT"
publish = false

# Libraries use ordinary version requirements; the programs that ship pin
# `=x.y.z` with the licence and the reason beside each (DEVELOPMENT.md
# section 7). Every library needs the owner's approval by name, recorded
# in a decision (docs/architecture.md section 2).
[workspace.dependencies]
teletext-runtime = { path = "crates/teletext-runtime", default-features = false }

# The engine, imported at one commit and never copied (CLAUDE.md,
# requirement 2.5): its page model, TTI reader and page encoder, its input
# protocol, its audio encoder, and its web pieces (the WebSocket handshake).
neoteletext-core = { git = "file:///Users/andrewstuart/devel/neoteletext-engine", rev = "dcb2a3ba2d1091c787057a69aa360f15d6e0b18e", default-features = false }
neoteletext-formats = { git = "file:///Users/andrewstuart/devel/neoteletext-engine", rev = "dcb2a3ba2d1091c787057a69aa360f15d6e0b18e", default-features = false, features = ["tti"] }
neoteletext-input = { git = "file:///Users/andrewstuart/devel/neoteletext-engine", rev = "dcb2a3ba2d1091c787057a69aa360f15d6e0b18e", default-features = false }
neoteletext-audio = { git = "file:///Users/andrewstuart/devel/neoteletext-engine", rev = "dcb2a3ba2d1091c787057a69aa360f15d6e0b18e", default-features = false, features = ["encode"] }
neoteletext-web = { git = "file:///Users/andrewstuart/devel/neoteletext-engine", rev = "dcb2a3ba2d1091c787057a69aa360f15d6e0b18e", default-features = false }

# The native host's libraries, approved by the owner on 25 October 2026
# (decision 5).
tokio = { version = "=1.54.1", default-features = false }
hyper = { version = "=1.12.0", default-features = false }
hyper-util = { version = "=0.1.21", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
strip = true
